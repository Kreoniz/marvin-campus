name: marvin-campus
services:
  app:
    image: ${CAMPUS_IMAGE:-marvin-campus:local}
    build: .
    restart: unless-stopped
    ports:
      - '127.0.0.1:8080:8080'
    environment:
      UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      VUC_DATA_PATH: ${VUC_DATA_PATH:-}
      VUC_ORIGINALS_DIR: ${VUC_ORIGINALS_DIR:-}
    volumes:
      - cache:/data
    mem_limit: 192m
    cpus: 1.0
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '3'
volumes:
  cache:
